[tool]
id = "com.yousefalrushaid.lightbooks"
label = "Books"
versionCode = 1
versionName = "1.0.0"
# Books works fully offline: no internet or other permissions needed.
permissions = []
# Lets you send books from your computer through the LightOS Tool Manager.
capabilities = ["tool-manager-provider"]
# for the LightOS emulator, use the line below and build with -DlightSdk.allowAltServerPackage=true
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
orientation = "portrait"
